# Configuration file

general {
    # If true, prints a chat message when Inhibited is applied (duration + source).
    B:debug_mode=false

    ##########################################################################################################
    # dealing_damage
    #--------------------------------------------------------------------------------------------------------#
    # Applies Inhibited when the player deals damage.
    ##########################################################################################################

    dealing_damage {
        # Target entity IDs that ALWAYS trigger the effect, overriding include/exclude rules (except damageTypeBlackList). Format: "modid:entity_name".
        S:allowList <
         >

        # DamageSource types that should NOT trigger the effect (DamageSource#getDamageType). Example: "player", "mob".
        S:damageTypeBlackList <
         >

        # Effect duration in ticks (20 ticks = 1 second).
        I:durationTicks=300

        # Target entity IDs that should NEVER trigger, regardless of include rules. Format: "modid:entity_name".
        S:excludeList <
         >

        # Exclude players as targets. If true, hitting players will NOT trigger.
        B:excludePlayers=true

        # Include rule (living targets): if true, ANY living target is eligible (OR with the options below).
        B:includeAll=false

        # Include rule: eligible if the target is IMob (most hostile mobs).
        B:includeIMob=true

        # Include rule: eligible if the target is currently targeting any player (attack target == player).
        B:includeTargetingPlayers=true

        # Enable: apply Inhibited when the player deals damage.
        B:isEnabled=true
    }

    ##########################################################################################################
    # taking_damage
    #--------------------------------------------------------------------------------------------------------#
    # Applies Inhibited when the player takes damage.
    ##########################################################################################################

    taking_damage {
        # Attacker entity IDs that ALWAYS trigger the effect, overriding include/exclude rules (except damageTypeBlackList). Format: "modid:entity_name".
        S:allowList <
         >

        # DamageSource types that should NOT trigger the effect (DamageSource#getDamageType). Example: "fall", "lava".
        S:damageTypeBlackList <
            fall
            lava
            cactus
            drown
            inFire
            onFire
            hotFloor
            inWall
            starve
            outOfWorld
            lightningBolt
         >

        # Effect duration in ticks (20 ticks = 1 second).
        I:durationTicks=300

        # Attacker entity IDs that should NEVER trigger, regardless of include rules. Format: "modid:entity_name" (e.g., "minecraft:zombie").
        S:excludeList <
         >

        # Exclude players as attackers. If true, damage caused by players will NOT trigger.
        B:excludePlayers=true

        # Include rule (living attackers): if true, ANY living attacker is eligible (OR with the options below).
        B:includeAll=true

        # Include rule: eligible if the attacker is IMob (most hostile mobs).
        B:includeIMob=false

        # If true, damage with NO living attacker (fall, lava, cactus, etc.) can trigger the effect. If false, only damage caused by a living entity can trigger.
        B:includeNonEntityDamageSources=true

        # Include rule: eligible if the attacker is currently targeting any player (attack target == player).
        B:includeTargetingPlayers=false

        # Enable: apply Inhibited when the player takes damage.
        B:isEnabled=true
    }

    ##########################################################################################################
    # near_boss
    #--------------------------------------------------------------------------------------------------------#
    # Applies Inhibited while the player is within range of a configured boss entity.
    ##########################################################################################################

    near_boss {
        # Boss entity IDs (whitelist). Only these entities are treated as bosses. Format: "modid:entity_name".
        S:bossList <
            minecraft:wither
            minecraft:ender_dragon
         >

        # Scan radius in blocks.
        D:distanceBlocks=24.0

        # Duration in ticks applied/refreshed by this module.
        I:durationTicks=100

        # Enable this module.
        B:isEnabled=false

        # How often to scan (ticks). 20 ticks = 1 second.
        I:scanPeriodTicks=20
    }

    ##########################################################################################################
    # near_enemy
    #--------------------------------------------------------------------------------------------------------#
    # Applies Inhibited while the player is within range of a configured enemy entity.
    ##########################################################################################################

    near_enemy {
        # Entity IDs that ALWAYS match, overriding include/exclude rules. Format: "modid:entity_name".
        S:allowList <
         >

        # Scan radius in blocks.
        D:distanceBlocks=12.0

        # Duration in ticks applied/refreshed by this module.
        I:durationTicks=300

        # Entity IDs that NEVER match, regardless of other rules. Format: "modid:entity_name".
        S:excludeList <
         >

        # Exclude players as nearby entities.
        B:excludePlayers=true

        # Include rule: treat any nearby living entity as matching.
        B:includeAll=false

        # Include rule: treat IMob entities as matching (most hostile mobs).
        B:includeIMob=true

        # Include rule: treat entities targeting any player as matching (attack target is a player).
        B:includeTargetingPlayers=true

        # Enable this module.
        B:isEnabled=true

        # Maximum number of consecutive reapplications by this module while the player stays in range. -1 = unlimited.
        I:maxReapplications=1

        # Behavior mode: APPLY_EFFECT or PREVENT_EXPIRING.
        # Valid values:
        # APPLY_EFFECT
        # PREVENT_EXPIRING
        S:mode=PREVENT_EXPIRING

        # PREVENT_EXPIRING only: only refresh if remaining duration is <= this value (ticks).
        I:refreshWhenRemainingAtMostTicks=40

        # How often to scan (ticks). 20 ticks = 1 second.
        I:scanPeriodTicks=20
    }

}


